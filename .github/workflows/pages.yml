# pages-deploy — 公開頁(dashboard)改由 Actions 部署 (V8.67j, 2026-09-18)
# 背景: 引擎每 ~10 秒推送 gh-pages → legacy Pages 建置被高頻觸發, 全部失敗
#       ("Page build failed." 97/100) → 公開頁永遠停在舊版。
# 本 workflow: 手動(workflow_dispatch)/main 推送/每日收盤後排程, 抓 gh-pages 最新
#       raw dashboard 部署; 頁面本身每 1s 輪詢 raw → 內容永遠即時。
name: pages-deploy
on:
  workflow_dispatch:
  schedule:
    # 盤中每小時 + 收盤後 (台北 09:00/10:00/11:00/12:00/13:00/13:40; UTC+8)
    # 由來: 部署頁若停在「昨日收工版」(可能不含 rt-status meta 或 content!=live),
    # 頁面自己的 1s raw 輪詢會被 gate 擋住 → 公開頁整個上午凍結 (2026-09-21 事故)。
    # 提高部署頻率 → 部署頁內容永遠是盤中即時版 (meta=live) → 輪詢存活。
    - cron: '0 1,2,3,4,5 * * 1-5'
    - cron: '40 5 * * 1-5'
  push:
    branches: [ main ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch latest dashboard from gh-pages
        run: |
          mkdir -p public/html public/data
          curl -fsSL --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/html/dashboard.html" -o public/html/dashboard.html
          curl -fsSL --retry 3 --retry-delay 2 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/data/sync_probe.txt" -o public/data/sync_probe.txt || true
          echo '<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./html/dashboard.html"><title>dashboard</title></head><body><a href="./html/dashboard.html">dashboard</a></body></html>' > public/index.html
          ls -lR public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
